[workspace]
resolver = "2"
members = ["crates/dsp", "crates/project", "crates/engine", "crates/library", "crates/fetch", "crates/app", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tstudio-dsp = { path = "crates/dsp" }
tstudio-project = { path = "crates/project" }
tstudio-engine = { path = "crates/engine" }
tstudio-library = { path = "crates/library" }
tstudio-fetch = { path = "crates/fetch" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
eframe = "0.29"
egui = "0.29"
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
hound = "3.5"
rtrb = "0.3"
rfd = "0.15"
midir = "0.10"
directories = "5"
crossbeam-channel = "0.5"
clap = { version = "4.5", features = ["derive"] }
rustysynth = "1.3"
midly = { version = "0.5", default-features = false, features = ["alloc", "std"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# rustysynth with a fix for SoundFonts containing empty instruments (see vendor/rustysynth)
[patch.crates-io]
rustysynth = { path = "vendor/rustysynth" }
